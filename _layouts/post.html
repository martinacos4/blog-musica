---
layout: default
---
<h1>{{ page.title }}</h1>
<p class="fecha">{{ page.date | date: "%d/%m/%Y" }}</p>

{{ content }}

<nav class="navegacion">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% endif %}
  {% if page.next %}<a class="siguiente" href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif %}
</nav>
