<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/img/icono.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/estilos.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="marca" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Inicio</a>
      <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>Hecho por {{ site.author }} con Jekyll y GitHub Pages</footer>
</body>
</html>
