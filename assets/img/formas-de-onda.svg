<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>Las cuatro formas de onda básicas: seno, cuadrada, sierra y triangular</title>
  <style>text { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
  <rect width="960" height="540" fill="#1c2333"/>

