  <!-- Cuadrada -->
  <rect x="490" y="30" width="440" height="230" rx="16" fill="#252e42"/>
  <text x="518" y="80" fill="#eef0f4" font-size="28" font-weight="700">Cuadrada</text>
  <text x="902" y="80" fill="#aab2c5" font-size="19" text-anchor="end">hueca</text>
  <line x1="518" y1="178" x2="902" y2="178" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M518 178 V128 H614 V228 H710 V128 H806 V228 H902 V178" fill="none" stroke="#199e8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sierra -->
  <rect x="30" y="280" width="440" height="230" rx="16" fill="#252e42"/>
  <text x="58" y="330" fill="#eef0f4" font-size="28" font-weight="700">Sierra</text>
  <text x="442" y="330" fill="#aab2c5" font-size="19" text-anchor="end">brillante</text>
  <line x1="58" y1="428" x2="442" y2="428" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M58 428 L154 378 V478 L346 378 V478 L442 428" fill="none" stroke="#c98500" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Triangular -->
  <rect x="490" y="280" width="440" height="230" rx="16" fill="#252e42"/>
  <text x="518" y="330" fill="#eef0f4" font-size="28" font-weight="700">Triangular</text>
  <text x="902" y="330" fill="#aab2c5" font-size="19" text-anchor="end">intermedia</text>
  <line x1="518" y1="428" x2="902" y2="428" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M518 428 L566 378 L662 478 L758 378 L854 478 L902 428" fill="none" stroke="#9085e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
