<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img">
  <title>Cómo se conectan la guitarra, la interfaz, el computador, los audífonos y el controlador MIDI</title>
  <style>text { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
  <rect width="800" height="430" fill="#1c2333"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c5"/></marker>
    <marker id="flecha-midi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9085e9"/></marker>
  </defs>
  <rect x="30" y="30" width="200" height="140" rx="16" fill="#252e42" stroke="#c98500" stroke-width="2.5"/>
  <text x="130" y="130" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Guitarra o</text>
  <text x="130" y="154" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">micrófono</text>
  <rect x="300" y="30" width="200" height="140" rx="16" fill="#252e42" stroke="#e0623c" stroke-width="2.5"/>
  <text x="400" y="130" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Interfaz</text>
  <text x="400" y="154" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">de audio</text>
  <rect x="570" y="30" width="200" height="140" rx="16" fill="#252e42" stroke="#199e8a" stroke-width="2.5"/>
  <text x="670" y="130" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Computador</text>
  <text x="670" y="154" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">con la DAW</text>
  <rect x="300" y="260" width="200" height="140" rx="16" fill="#252e42" stroke="#aab2c5" stroke-width="2.5"/>
  <text x="400" y="370" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Audífonos</text>
  <rect x="570" y="260" width="200" height="140" rx="16" fill="#252e42" stroke="#9085e9" stroke-width="2.5"/>
  <text x="670" y="360" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Controlador</text>
  <text x="670" y="384" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">MIDI</text>

