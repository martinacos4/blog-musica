  <rect x="665.8" y="288" width="8" height="20" rx="1.5" fill="#eef0f4"/>
  <rect x="675.4" y="288" width="8" height="20" rx="1.5" fill="#eef0f4"/>
  <rect x="685" y="288" width="8" height="20" rx="1.5" fill="#eef0f4"/>
  <rect x="694.6" y="288" width="8" height="20" rx="1.5" fill="#eef0f4"/>
  <rect x="643.4" y="288" width="5" height="12" fill="#1c2333"/>
  <rect x="653" y="288" width="5" height="12" fill="#1c2333"/>
  <rect x="672.2" y="288" width="5" height="12" fill="#1c2333"/>
  <rect x="681.8" y="288" width="5" height="12" fill="#1c2333"/>
  <rect x="691.4" y="288" width="5" height="12" fill="#1c2333"/>

  <!-- Conexiones -->
  <line x1="234" y1="100" x2="294" y2="100" stroke="#aab2c5" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="506" y1="100" x2="564" y2="100" stroke="#aab2c5" stroke-width="3" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <line x1="400" y1="174" x2="400" y2="254" stroke="#aab2c5" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="670" y1="256" x2="670" y2="176" stroke="#9085e9" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#flecha-midi)"/>
  <text x="265" y="88" fill="#aab2c5" font-size="15" text-anchor="middle">cable</text>
  <text x="535" y="88" fill="#aab2c5" font-size="15" text-anchor="middle">USB</text>
  <text x="412" y="220" fill="#aab2c5" font-size="15">salida</text>
  <text x="682" y="220" fill="#aab2c5" font-size="15">USB</text>

  <!-- Leyenda -->
  <line x1="44" y1="300" x2="92" y2="300" stroke="#aab2c5" stroke-width="3"/>
  <text x="104" y="306" fill="#eef0f4" font-size="17">audio</text>
  <line x1="44" y1="340" x2="92" y2="340" stroke="#9085e9" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="104" y="346" fill="#eef0f4" font-size="17">MIDI (notas)</text>
