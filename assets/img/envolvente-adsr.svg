<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <title>Envolvente ADSR: ataque, caída, sostenimiento y liberación</title>
  <style>text { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
  <rect width="960" height="480" fill="#1c2333"/>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c5"/></marker>
  </defs>

  <!-- Relleno bajo la curva -->
  <path d="M90 380 L230 110 L360 220 L690 220 L870 380 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Separadores de cada fase -->
  <line x1="230" y1="96" x2="230" y2="380" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="360" y1="96" x2="360" y2="380" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="690" y1="96" x2="690" y2="380" stroke="#3a4560" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Ejes -->
  <line x1="90" y1="380" x2="90" y2="86" stroke="#4a5674" stroke-width="2"/>
  <line x1="90" y1="380" x2="912" y2="380" stroke="#4a5674" stroke-width="2" marker-end="url(#punta)"/>
  <text x="52" y="233.0" fill="#aab2c5" font-size="18" text-anchor="middle" transform="rotate(-90 52 233.0)">Volumen</text>
  <text x="912" y="414" fill="#aab2c5" font-size="18" text-anchor="end">Tiempo</text>

  <!-- La envolvente, un color por fase -->
  <line x1="90" y1="380" x2="230" y2="110" stroke="#e0623c" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="110" x2="360" y2="220" stroke="#199e8a" stroke-width="5" stroke-linecap="round"/>
  <line x1="360" y1="220" x2="690" y2="220" stroke="#c98500" stroke-width="5" stroke-linecap="round"/>
  <line x1="690" y1="220" x2="870" y2="380" stroke="#9085e9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="230" cy="110" r="7" fill="#1c2333" stroke="#eef0f4" stroke-width="3"/>
  <circle cx="360" cy="220" r="7" fill="#1c2333" stroke="#eef0f4" stroke-width="3"/>
  <circle cx="690" cy="220" r="7" fill="#1c2333" stroke="#eef0f4" stroke-width="3"/>

  <!-- Nombres de las fases -->
  <rect x="140" y="26" width="40" height="5" rx="2.5" fill="#e0623c"/>
  <text x="160" y="56" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Ataque</text>
  <text x="160" y="78" fill="#aab2c5" font-size="15" text-anchor="middle">(attack)</text>
  <rect x="275" y="26" width="40" height="5" rx="2.5" fill="#199e8a"/>
  <text x="295" y="56" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Caída</text>
  <text x="295" y="78" fill="#aab2c5" font-size="15" text-anchor="middle">(decay)</text>
  <rect x="505" y="26" width="40" height="5" rx="2.5" fill="#c98500"/>
  <text x="525" y="56" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Sostenimiento</text>
  <text x="525" y="78" fill="#aab2c5" font-size="15" text-anchor="middle">(sustain)</text>
  <rect x="760" y="26" width="40" height="5" rx="2.5" fill="#9085e9"/>
  <text x="780" y="56" fill="#eef0f4" font-size="20" font-weight="600" text-anchor="middle">Liberación</text>
  <text x="780" y="78" fill="#aab2c5" font-size="15" text-anchor="middle">(release)</text>

  <!-- Nivel de sustain -->
  <line x1="610" y1="376" x2="610" y2="226" stroke="#aab2c5" stroke-width="2" marker-start="url(#punta)" marker-end="url(#punta)"/>
  <text x="598" y="306.0" fill="#aab2c5" font-size="16" text-anchor="end">nivel de sustain</text>

  <!-- Eventos de la tecla -->
  <path d="M83 388 H97 L90 380 Z" fill="#eef0f4"/>
  <text x="90" y="414" fill="#eef0f4" font-size="16" text-anchor="start">tecla presionada</text>
  <path d="M683 388 H697 L690 380 Z" fill="#eef0f4"/>
  <text x="690" y="414" fill="#eef0f4" font-size="16" text-anchor="middle">tecla soltada</text>
</svg>
